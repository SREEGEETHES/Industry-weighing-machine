<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trade Kings Admin</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<script>
// Auth check - redirect to login if not authenticated
const auth = sessionStorage.getItem("tk_auth");
if (!auth) {
  window.location.href = "login.html";
}
</script>

<div id="app">
  <header class="topbar">
    <div class="brand">Trade <span>Kings</span></div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode">🌙</button>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="stations">Stations</button>
    <button class="tab-btn" data-tab="presets">Weight Presets</button>
    <button class="tab-btn" data-tab="recipients">Email Recipients</button>
    <button class="tab-btn" data-tab="records">Box Records</button>
    <button class="tab-btn" data-tab="reports">Reports</button>
  </nav>

  <main>
    <section id="tab-stations" class="tab-panel active">
      <div class="panel-header">
        <h2>Stations</h2>
        <button class="btn-primary" id="newStationBtn">+ New Station</button>
      </div>
      <div id="stationsList" class="card-grid"></div>
    </section>

    <section id="tab-presets" class="tab-panel">
      <div class="panel-header">
        <h2>Weight Presets</h2>
        <button class="btn-primary" id="newPresetBtn">+ New Preset</button>
      </div>
      <table class="data-table" id="presetsTable">
        <thead>
          <tr><th>Name</th><th>Product Code</th><th>Target (kg)</th><th>Min (kg)</th><th>Max (kg)</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="tab-recipients" class="tab-panel">
      <div class="panel-header">
        <h2>Email Recipients</h2>
        <button class="btn-primary" id="newRecipientBtn">+ Add Recipient</button>
      </div>
      <table class="data-table" id="recipientsTable">
        <thead><tr><th>Name</th><th>Email</th><th>Active</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="tab-records" class="tab-panel">
      <div class="panel-header">
        <h2>Box Records</h2>
        <div class="filters">
          <select id="filterStation"><option value="">All Stations</option></select>
          <select id="filterStatus">
            <option value="">All Print Status</option>
            <option value="printed">Printed</option>
            <option value="failed">Failed</option>
            <option value="pending">Pending</option>
          </select>
          <button id="refreshRecordsBtn" class="btn-secondary">Refresh</button>
        </div>
      </div>
      <table class="data-table" id="recordsTable">
        <thead>
          <tr>
            <th>Box ID</th><th>Date/Time</th><th>Station</th><th>Weight</th>
            <th>Tolerance</th><th>Print Status</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="tab-reports" class="tab-panel">
      <div class="panel-header">
        <h2>Weekly Reports</h2>
        <button class="btn-primary" id="runReportBtn">Run Report Now</button>
      </div>
      <table class="data-table" id="reportsTable">
        <thead><tr><th>Period</th><th>Recipients</th><th>Boxes</th><th>Sent At</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="app.js"></script>
</body>
</html>
